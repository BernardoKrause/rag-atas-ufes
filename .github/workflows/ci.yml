name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_USER: rag_atas_ufes
  POSTGRES_PASSWORD: changeme
  POSTGRES_DB: rag_atas_ufes
  POSTGRES_PORT: 5433
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: changeme
  NEO4J_HTTP_PORT: 7474
  NEO4J_BOLT_PORT: 7687
  QDRANT_HTTP_PORT: 6333
  QDRANT_GRPC_PORT: 6334
  OLLAMA_PORT: 11434
  # placeholder: nenhum teste le o corpus real por essa variavel, so os 6
  # fixtures em tests/fixtures/atas_sample (passados explicitamente aos testes)
  ANONYMIZATION_SECRET_KEY: ci-placeholder-secret-key-nao-usar-em-producao
  ATAS_CORPUS_PATH: /tmp/atas-corpus-placeholder

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - "5433:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: ${{ env.NEO4J_USER }}/${{ env.NEO4J_PASSWORD }}
        ports:
          - "7474:7474"
          - "7687:7687"
        options: >-
          --health-cmd "cypher-shell -u ${{ env.NEO4J_USER }} -p ${{ env.NEO4J_PASSWORD }} 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - "6333:6333"
          - "6334:6334"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Test
        run: pytest -v
