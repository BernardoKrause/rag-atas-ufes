  pergunta: A câmara do Departamento de Farmácia e Nutrição decidiu continuar se reunindo à distância, por videoconferência, ou voltar a se encontrar pessoalmente?
  resposta_referencia: 'Decidiu continuar no formato virtual: em 28/03/2025, a câmara do Departamento de Farmácia e Nutrição (DFN/CCENS) aprovou por unanimidade a manutenção das suas reuniões na modalidade virtual.'
