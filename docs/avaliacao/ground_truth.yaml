- id: a21
  categoria: inter_atas
  origem: autor
  pergunta: Quais relatórios de empresas juniores o Departamento de Engenharia e Tecnologia (DET) do CEUNES aprovou em 2024?
  resposta_referencia: 'Em 2024 o DET aprovou, por unanimidade, os relatórios anuais de três empresas juniores: Zetta Júnior (período de 05/2023 a 05/2024) e Energy Júnior (período de 04/2022 a 04/2023), na reunião de 09/07/2024, e Projeta Júnior (período de 06/04/2023 a 06/04/2024), na reunião de 20/08/2024.'
  itens_relevantes:
  - 1833_PAUTA_4
  - 1833_PAUTA_6
  - 1837_PAUTA_3
  trechos_evidencia:
  - parecer favorável ao relatório anual de atividades da Empresa Zetta Júnior
  - Relatório anual de atividades da Empresa Energy Júnior
  - Relatório anual 2023 da Empresa Júnior Projeta Jr
  tipo_dificuldade: 2 atas do mesmo departamento; 3 itens
  observacao: O item 1833_PAUTA_1 (expediente que inclui o processo da Energy Júnior na pauta) não informa aprovação e não foi considerado. Relatórios de empresas juniores de outros órgãos (DER, DFN, DCE, CAR) ficam fora do escopo.
