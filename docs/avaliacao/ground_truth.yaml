  pergunta: Como foi conduzido no Departamento de Matemática Aplicada (DMA) do CEUNES o Processo Seletivo 13/2025 para professor substituto, do pedido de abertura à contratação?
  resposta_referencia: 'Em 30/01/2025, o DMA informou que solicitou ao DGP autorização para abrir processo seletivo para 2025/1; em 20/02/2025, informou que o Processo Seletivo 13/2025 estava em andamento e aprovou por unanimidade o ad referendum que formalizou a comissão de avaliação; em 13/03/2025, informou o resultado (dois candidatos aprovados, em 1º e 2º lugar); em 27/03/2025, homologou o resultado por unanimidade (houve inscrições apenas na ampla concorrência); e em 08/05/2025, informou que as contratações tramitavam na PROGEP: a do 1º colocado seria concluída na semana seguinte, e a do 2º tinha um impedimento (havia dado aulas no IFES havia menos de dois anos), objeto de mandado de segurança à espera de resposta da Procuradoria.'
  itens_relevantes:
  - 1842_INFORMES_1
  - 1843_INFORMES_1
  - 1843_PAUTA_3
  - 1844_INFORMES_1
  - 1845_PAUTA_3
  - 1846_INFORMES_1
  trechos_evidencia:
  - Foi solicitado ao DGP autorização para abertura de processo seletivo para 2025/1
  - o processo seletivo de 2025 está em andamento
  - formalização da Comissão de Avaliação do Processso Seleitivo 13/2025
  - foi aprovado em primeiro lugar
  - os inscritos somente se cadidataram pelo formato de Ampla concorrência
  - a contratação dos professores substitutos ainda está tramitando na PROGEP
  sequencia_cronologica:
  - 1842_INFORMES_1
  - 1843_INFORMES_1
  - 1843_PAUTA_3
  - 1844_INFORMES_1
  - 1845_PAUTA_3
  - 1846_INFORMES_1
  tipo_dificuldade: requer datas de 5 reuniões; processo administrativo acompanhado do início à contratação
  observacao: 'A pergunta foi reescrita depois do primeiro pool (''do pedido de abertura à contratação'', antes ''da comissão à contratação'') para abranger o pedido de 30/01/2025, e o pool foi refeito só para ela. Falha forte de recuperação: só 1842_INFORMES_1 veio no pool (configuração D); os outros cinco itens foram incluídos por busca direta. 1842_INFORMES_1 não cita o número 13/2025 (inferido pelo período). 1847_INFORMES_1 (22/05/2025, contratação de dois professores com tokens de pessoa diferentes dos aprovados) ficou de fora; ver dúvidas. 1846_INFORMES_1 contém um nome próprio não anonimizado; o trecho escolhido evita esse nome.'
