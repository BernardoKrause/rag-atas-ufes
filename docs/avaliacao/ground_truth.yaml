  categoria: intra_reformulada
  origem: autor
  pergunta: O Colegiado de Pedagogia decidiu disponibilizar na internet os registros de suas reuniões?
  resposta_referencia: Sim. Em 13/07/2022, o Colegiado de Pedagogia aprovou por unanimidade publicar no site do Centro de Educação as atas de suas reuniões a partir do início da gestão da coordenadora, abrindo espaço também para as portarias de indicação dos membros do Colegiado e do NDE.
  itens_relevantes:
  - 1783_INFORMES_3.1
  trechos_evidencia:
  - publicitar no site do Centro de Educação as atas
  tipo_dificuldade: paráfrase (disponibilizar na internet os registros no lugar de publicização das atas)
  observacao: Item da seção INFORMES, mas com desfecho Aprovado. Recuperado em 1º lugar pelas 4 configurações.
