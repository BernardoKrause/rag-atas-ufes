perguntas:
- id: a01
  categoria: intra_exata
  origem: autor
  pergunta: O Conselho Departamental do Centro de Artes aprovou o credenciamento da empresa júnior Archipolis Júnior?
  resposta_referencia: Sim. Na reunião de 27/02/2025, o Conselho Departamental do Centro de Artes (CAR) aprovou por unanimidade o parecer favorável à ação de extensão e ao credenciamento da empresa júnior Archipolis Júnior, solicitado por um docente e já aprovado pelo DAU.
  itens_relevantes:
  - 1719_PAUTA_05
  trechos_evidencia:
  - sou de parecer favorável à aprovação da ação de extensão e ao credenciamento da Archipolis Júnior
  tipo_dificuldade: termo exato no assunto (nome da empresa júnior)
  observacao: Item recuperado em 1º lugar nas 4 configurações. O item 1717_PAUTA_06 (relatório técnico do projeto de extensão Archipolis, 18/06/2025) trata de outro assunto e foi julgado não relevante.
- id: a02
  categoria: intra_exata
  origem: autor
  pergunta: Qual foi a decisão do Conselho Departamental do CCE sobre o Projeto Político Pedagógico do curso de Licenciatura Intercultural Indígena?
  resposta_referencia: Na reunião de 29/10/2013, o Conselho Departamental do CCE rejeitou, por maioria, o parecer da relatora que propunha devolver o processo ao Departamento de Matemática (DMAT) e, em seguida, aprovou a proposta de que o Conselho aprovasse o Projeto Político Pedagógico do curso de Licenciatura Intercultural Indígena, após encaminhar o processo ao DMAT para apensar a homologação do ad referendum da chefia do DMAT. O item está classificado como 'Reprovado', mas o que foi reprovado foi o parecer, não o projeto.
  itens_relevantes:
  - 1985_PAUTA_7
  trechos_evidencia:
  - o parecer foi colocado em votação e rejeitado pela maioria dos presentes
  tipo_dificuldade: termo exato; desfecho do item ('Reprovado') induz a erro
  observacao: O tipo_desfecho extraído é 'Reprovado', mas o texto mostra que o parecer foi rejeitado e o processo aprovado. Bom teste de leitura do texto em vez do rótulo.
- id: a03
  categoria: intra_exata
  origem: autor
  pergunta: Foi aprovada a criação da disciplina "Agricultura Digital" no Programa de Pós-Graduação em Agronomia do CCAE?
  resposta_referencia: Sim. Em 13/02/2025, a proposta de criação da disciplina "Agricultura Digital" no âmbito do PPG em Agronomia (registrada nas atas do CCAE_DPV), com parecer favorável da Comissão de Ensino, foi aprovada por unanimidade.
  itens_relevantes:
  - 1927_ORDEM_DO_DIA_2.2
  trechos_evidencia:
  - Proposta de criação da disciplina “Agricultura Digital” no âmbito do PPG em Agronomia
  tipo_dificuldade: termo exato no assunto (nome da disciplina)
  observacao: Recuperado em 1º lugar pelas configurações B e D; o léxico (C) e a configuração A não o trouxeram no top-10.
- id: a04
  categoria: intra_exata
  origem: autor
  pergunta: O que o Departamento de Engenharia Rural (DER) do CCAE decidiu sobre a redução do número de vagas na oferta do curso de Sistemas de Informação?
  resposta_referencia: Em 06/11/2024, o Departamento de Engenharia Rural (DER) do CCAE aprovou, por maioria, a redução do número de vagas na oferta do curso de Sistemas de Informação de 70 para 40 vagas.
  itens_relevantes:
  - 1864_ORDEM_DO_DIA_3.1
  trechos_evidencia:
  - Redução no número de vagas na oferta do curso de Sistemas de Informação de 70 para 40 vagas
  tipo_dificuldade: termo exato no assunto (vagas de Sistemas de Informação)
  observacao: 'Falha de recuperação: o item não apareceu no top-10 de nenhuma configuração e foi incluído no pool por busca direta. O pool trouxe itens do CCENS_DC sobre redução de vagas de uma disciplina (40 para 35), que não respondem.'
- id: a05
  categoria: intra_exata
  origem: autor
  pergunta: O que foi relatado na câmara departamental do DCAB do CEUNES sobre as sacas de café da Fazenda Experimental?
  resposta_referencia: Na reunião de 26/02/2025 do DCAB (CEUNES), um docente relatou um erro no quantitativo das sacas de café da Fazenda Experimental, que será leiloado; o único impacto real foi no prazo, que já foi ajustado.
  itens_relevantes:
  - 1789_INFORMES_3
  trechos_evidencia:
  - houve um crro no quantitativo das sacas de café da Fazenda Experimental
  tipo_dificuldade: termo exato; ata com OCR (CEUNES_DCAB)
  observacao: Ata digitalizada por OCR ('crro' no lugar de 'erro'). Recuperado em 1º lugar pelas 4 configurações.
- id: a06
  categoria: intra_exata
  origem: autor
  pergunta: O Conselho Departamental do CT aprovou a proposta da Coordenação do Curso de Engenharia de Computação de alterar a nota mínima de "Matemática e suas Tecnologias" no Enem a partir do SiSU 2026?
  resposta_referencia: Sim. Em 10/10/2025, após um pedido de vista (o conselheiro que pediu vista não compareceu nem enviou parecer), o Conselho Departamental do CT aprovou por unanimidade a proposta da Coordenação do Curso de Engenharia de Computação de alterar a nota mínima de "Matemática e suas Tecnologias" no Enem a partir do SiSU 2026. A ata não registra o novo valor da nota.
  itens_relevantes:
  - 1764_PAUTA_13
  trechos_evidencia:
  - Coordenação do Curso de Engenharia de Computação - Proposta de alteração da nota mínima
  tipo_dificuldade: termo exato; item quase idêntico de outro curso na mesma ata
  observacao: O item 1764_PAUTA_14 é a mesma proposta para o curso de Ciência da Computação, na mesma reunião; foi julgado não relevante porque a pergunta é sobre Engenharia de Computação. O valor da nota está ausente no texto ('para pontos').
- id: a07
  categoria: intra_exata
  origem: autor
  pergunta: O que a Câmara Local de Graduação do CCHN discutiu sobre o Setor de Tradução em Libras e a oferta de tradutores para os cursos de graduação?
  resposta_referencia: Em 08/02/2021, a Direção informou à Câmara Local de Graduação do CCHN que as demandas de atendimento a estudantes surdos e do curso de Letras Libras superavam a capacidade da equipe do Setor de Tradução; houve reuniões com a equipe, com professores de Letras Libras e com a Reitoria, pedindo, entre outras providências, que tradutores/intérpretes do CEUNES e dos centros de Alegre apoiassem o setor. A Direção seguiria demandando a ampliação da equipe e, até lá, professores de Letras Libras fluentes em Libras poderiam ficar sem tradutores para priorizar estudantes surdos de outros cursos.
  itens_relevantes:
  - 1773_PAUTA_3.01
  trechos_evidencia:
  - Essa demanda tem sido superior à capacidade de atendimento da equipe
  tipo_dificuldade: termo exato no assunto (Setor de Tradução em Libras)
  observacao: Recuperado em 1º lugar pelas 4 configurações. O informe do Colegiado de Pedagogia sobre estudantes surdos (305_INFORMES_3.1) é de outro órgão e foi julgado não relevante.
- id: a08
  categoria: intra_exata
  origem: autor
  pergunta: Qual foi a decisão do Colegiado do curso de Pedagogia sobre o pedido de apostilamento de diploma para habilitação no magistério da Educação Infantil apreciado em agosto de 2021?
  resposta_referencia: Em 02/08/2021, o Colegiado do curso de Pedagogia indeferiu o pedido de apostilamento de uma egressa de Pedagogia – Supervisão Escolar (curso concluído em 1993), porque não houve comprovação de disciplinas de metodologia e de prática de ensino/estágio da Educação Infantil exigidas pela Resolução nº 9/2007.
  itens_relevantes:
  - 1784_PAUTA_3.1
  trechos_evidencia:
  - decide pelo indeferimento do apostilamento
  tipo_dificuldade: termo exato (apostilamento); desfecho reprovado
  observacao: Recuperado em 1º lugar pelas 4 configurações.
- id: a09
  categoria: intra_exata
  origem: autor
  pergunta: O Conselho Departamental do CEFD aprovou o Convênio Carrefour de bolsas de estudo e permanência para pessoas negras na pós-graduação? O que o PPGEF obteve?
  resposta_referencia: Sim. Em 28/06/2023, o Conselho Departamental do CEFD aprovou por unanimidade o Convênio Carrefour de bolsas de estudo e permanência para pessoas negras na pós-graduação, originado do Termo de Ajustamento de Conduta entre o Ministério Público Federal e o Grupo Carrefour. O PPGEF foi contemplado com uma bolsa de mestrado (24 meses) e uma de doutorado (48 meses).
  itens_relevantes:
  - 1755_PROCESSOS_PROJETOS_2
  trechos_evidencia:
  - foi contemplado com uma bolsa de mestrado e uma bolsa de doutorado
  tipo_dificuldade: termo exato no assunto (Convênio Carrefour)
  observacao: Recuperado em 1º lugar pelas 4 configurações. Há outra menção ao Carrefour no DCAB (1790_INFORMES_7, edital de 2023 do colegiado), fora do escopo da pergunta.
- id: a10
  categoria: intra_exata
  origem: autor
  pergunta: Como o Departamento de Educação e Ciências Humanas (DECH) do CEUNES apreciou a proposta de alteração de entrada do curso de Ciências Biológicas - Licenciatura?
  resposta_referencia: Em 03/10/2024, o DECH apreciou a proposta do Colegiado de Ciências Biológicas – Licenciatura de alterar a entrada do curso do segundo para o primeiro semestre, com início previsto para 2025/1, mudando pré-requisitos (por exemplo, Didática e os estágios supervisionados passam a 'sem pré-requisitos') e a periodização de disciplinas ofertadas pelo DECH. A Comissão de Ensino deu parecer favorável e a proposta foi aprovada por unanimidade.
  itens_relevantes:
  - 1826_PAUTA_2
  trechos_evidencia:
  - com intuito de alterar a entrada do curso, do segundo para o primeiro semestre do ano, com previsão de início para 2025/1
  tipo_dificuldade: termo exato no assunto (alteração de entrada de curso)
  observacao: 'O campo tipo_desfecho do item está vazio, mas o texto termina com ''Decisão: Em pauta Aprovado por unanimidade.'''
- id: a11
  categoria: intra_reformulada
  origem: autor
  pergunta: O Conselho do CEFD autorizou os estudantes a fazerem uma arte mural coletiva na entrada do prédio do Centro?
  resposta_referencia: Sim. Em 27/09/2023, o Conselho Departamental do CEFD aprovou por unanimidade a proposta, apresentada pelo presidente do Diretório Acadêmico '26 de Junho', de pintura colaborativa de um painel no hall do CEFD pelos alunos; o esboço seria apresentado aos conselheiros.
  itens_relevantes:
  - 1754_PAUTA_2
  trechos_evidencia:
  - proposta de pintura de painel no hall do CEFD
  tipo_dificuldade: paráfrase (arte mural / entrada do prédio no lugar de pintura de painel / hall)
  observacao: 'Termos da pergunta ausentes no item: ''mural'', ''arte'', ''entrada'' não aparecem; o item fala em ''pintura de painel no hall''.'
- id: a12
  categoria: intra_reformulada
  origem: autor
  pergunta: Algum docente do DET do CEUNES relatou ter sido ameaçado por cães soltos perto do prédio do departamento?
  resposta_referencia: Sim. Em 25/06/2024, uma professora informou no DET que foi cercada por quatro cachorros grandes na saída do departamento e só não foi atacada porque o carro da segurança passou naquele momento; ela pediu que a chefia solicitasse providências na sessão do Conselho Departamental.
  itens_relevantes:
  - 1832_INFORMES_1
  trechos_evidencia:
  - foi cercada por quatro cachorros grandes na saída do departamento
  tipo_dificuldade: paráfrase (cães soltos no lugar de cachorros)
  observacao: '''cães'' aparece no corpus só em outro contexto (1788_INFORMES_5, DCAB). Recuperado pelas configurações B e D, não pelo léxico.'
- id: a13
  categoria: intra_reformulada
  origem: autor
  pergunta: Que sistema o CCHN adotou em 2023 para colher rubricas digitais em seus papéis institucionais?
  resposta_referencia: A plataforma Asten. Em 14/02/2023 foi comunicado ao Conselho do CCHN que, a partir de 2023, o centro passaria a usar a Asten, contratada pela Ufes, para assinatura de documentos oficiais, inclusive atas, com vantagens sobre o Lepisma (qualquer usuário @ufes pode solicitar assinaturas, envio a vários signatários ao mesmo tempo, facilidade para alunos e pessoas externas, validade fora da instituição).
  itens_relevantes:
  - 1737_COMUNICACOES_1.03
  trechos_evidencia:
  - o CCHN passará a adotar a plataforma Asten para assinatura de documentos oficiais
  tipo_dificuldade: paráfrase (rubricas digitais / papéis institucionais no lugar de assinatura de documentos)
  observacao: Termos-chave do item ('Asten', 'assinatura', 'documentos oficiais') não aparecem na pergunta. Recuperado em 1º lugar pelas 4 configurações.
- id: a14
  categoria: intra_reformulada
  origem: autor
  pergunta: No Conselho Departamental do CCAE, o que foi comunicado sobre a geração de energia solar no campus de Alegre?
  resposta_referencia: Em 12/06/2025, a Presidente do Conselho Departamental do CCAE comunicou que foi aprovada a emenda de bancada que prevê a instalação de usina fotovoltaica na Ufes Campus de Alegre; a Diretoria de Infraestrutura - Setorial Sul fez o estudo técnico dos locais de instalação e o processo já está em andamento.
  itens_relevantes:
  - 1722_COMUNICACOES_4.2
  trechos_evidencia:
  - foi aprovada a emenda de bancada que prevê a instalação de usina fotovoltaica na Ufes Campus de Alegre
  tipo_dificuldade: paráfrase (energia solar no lugar de usina fotovoltaica)
  observacao: '''energia solar'' não aparece em nenhum item do corpus. Só a configuração D (vetorial) trouxe o item. O informe do DFN 1682_COMUNICACOES_4.7 (energia fotovoltaica em andamento, previsão 2026) é de outro órgão e não foi considerado relevante porque a pergunta restringe ao Conselho do CCAE.'
- id: a15
  categoria: intra_reformulada
  origem: autor
  pergunta: Em 2010, o que o Conselho Departamental do CCE decidiu sobre a época de descanso anual dos servidores técnico-administrativos do Centro?
  resposta_referencia: 'Em 27/10/2010, o Conselho Departamental do CCE aprovou por unanimidade a alteração da Decisão nº 001/2008, que normatiza as férias dos servidores técnicos em educação do Centro: como as aulas começariam no fim de fevereiro, a primeira opção de férias passou a ser do início de janeiro ao final de fevereiro e a segunda, quinze dias em julho, no recesso acadêmico.'
  itens_relevantes:
  - 1957_PAUTA_10
  trechos_evidencia:
  - Como primeira opção, início do mês de janeiro a final de fevereiro, e como segunda opção, quinze dias em julho, no recesso acadêmico
  tipo_dificuldade: paráfrase (época de descanso anual no lugar de férias)
  observacao: Só a configuração D trouxe o item. 1991_PAUTA_1 (2014) menciona férias dos técnicos de acordo com o calendário acadêmico, mas não é a decisão de 2010.
- id: a16
  categoria: intra_reformulada
  origem: autor
  pergunta: Qual preocupação a direção do CEUNES manifestou sobre a pouca procura dos estudantes pelo refeitório à noite?
  resposta_referencia: Em 06/05/2024, o Presidente do Conselho Departamental do CEUNES manifestou preocupação com a baixa frequência dos estudantes no Restaurante Universitário no turno noturno, porque há planejamento de um número de refeições e a baixa frequência gera desperdício; o presidente do DA se comprometeu a promover a conscientização dos estudantes.
  itens_relevantes:
  - 1854_INFORMES_2
  trechos_evidencia:
  - a baixa frequência acaba gerando desperdício
  tipo_dificuldade: paráfrase (refeitório / à noite no lugar de Restaurante Universitário / turno noturno)
  observacao: Só a configuração D trouxe o item (rank 1).
- id: a17
  categoria: intra_reformulada
  origem: autor
  pergunta: O museu de história natural ligado ao Departamento de Geologia do CCENS ganhou dinheiro destinado por deputados? Quanto e em que foi aplicado?
  resposta_referencia: Sim. Em 11/03/2024 foi comunicado no Departamento de Geologia (DG/CCENS) que o MUSES recebeu 370 mil reais por meio de emenda parlamentar; a verba foi usada na compra de equipamentos e os professores foram convidados a participar de projetos no MUSES.
  itens_relevantes:
  - 1683_COMUNICACOES_4.5
  trechos_evidencia:
  - o MUSES recebeu 370 mil reais de recursos financeiros por meio de emenda parlamentar
  tipo_dificuldade: paráfrase (museu / dinheiro de deputados no lugar de MUSES / emenda parlamentar)
  observacao: 'O item não usa ''museu'', ''deputado'' nem ''dinheiro''. A pergunta foi reescrita depois do primeiro pool para não repetir ''verba'' (palavra do item) e o pool foi refeito só para ela: o item ficou apenas no top-10 da configuração D (rank 8). 1686_COMUNICACOES_4.1 e 4.2 (Geodia e Semana Nacional de Museus no Museu de História Natural do Sul do Estado) foram julgados não relevantes.'
- id: a18
  categoria: intra_reformulada
  origem: autor
  pergunta: Quantos dias por semana os técnicos do DQF do CCENS poderão trabalhar de casa a partir de abril de 2025?
  resposta_referencia: Um dia por semana. Foi comunicado no DQF em 27/03/2025 que o PGD 2.0 dos técnicos do departamento entra em vigência em abril de 2025, com 20% de teletrabalho e 80% de trabalho presencial, o que equivale a um dia da semana em teletrabalho.
  itens_relevantes:
  - 1707_COMUNICACOES_4.6
  trechos_evidencia:
  - 20% de teletrabalho e 80% de trabalho presencial
  tipo_dificuldade: paráfrase (trabalhar de casa no lugar de teletrabalho / PGD)
  observacao: Recuperado em 1º lugar pelas configurações A, B e D.
